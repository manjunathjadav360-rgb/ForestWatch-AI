name: Validate ForestWatch prototype

on:
  push:
    paths:
      - "app.py"
      - "notebooks/**"
      - "data/forestwatch_top20_snapshot.csv"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "app.py"
      - "notebooks/**"
      - "data/forestwatch_top20_snapshot.csv"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dashboard dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run dashboard startup smoke test
        run: pytest -q
      - name: Check dashboard and notebook Python syntax
        run: |
          python -m py_compile app.py
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          notebook_path = Path("notebooks/forestwatch_pipeline_v2.ipynb")
          notebook = json.loads(notebook_path.read_text(encoding="utf-8"))
          checked = 0
          for index, cell in enumerate(notebook.get("cells", [])):
              if cell.get("cell_type") != "code":
                  continue
              source = "".join(cell.get("source", []))
              # Ignore standalone IPython line magics such as %pip.
              source = "\n".join(
                  line for line in source.splitlines()
                  if not line.lstrip().startswith(("%", "!"))
              )
              ast.parse(source, filename=f"{notebook_path}:cell-{index}")
              checked += 1
          print(f"Notebook JSON valid; parsed {checked} Python code cells.")
          PY
      - name: Validate committed pilot snapshot
        run: |
          python - <<'PY'
          import csv
          import math
          from pathlib import Path

          path = Path("data/forestwatch_top20_snapshot.csv")
          required = {
              "area_ha", "latitude", "longitude",
              "ndvi_drop_2024", "ndvi_drop_2025",
              "ndvi_change_2025_vs_2024",
              "radar_support_share", "radar_coverage_share",
          }
          with path.open(newline="", encoding="utf-8") as handle:
              reader = csv.DictReader(handle)
              missing = required - set(reader.fieldnames or [])
              if missing:
                  raise SystemExit(f"Missing columns: {sorted(missing)}")
              rows = list(reader)

          if len(rows) != 20:
              raise SystemExit(f"Expected 20 shortlist rows, found {len(rows)}")

          for index, row in enumerate(rows, start=1):
              values = {key: float(row[key]) for key in required}
              if not all(math.isfinite(value) for value in values.values()):
                  raise SystemExit(f"Row {index} contains a non-finite value")
              if values["area_ha"] <= 0:
                  raise SystemExit(f"Row {index} has non-positive area")
              if not -90 <= values["latitude"] <= 90:
                  raise SystemExit(f"Row {index} has invalid latitude")
              if not -180 <= values["longitude"] <= 180:
                  raise SystemExit(f"Row {index} has invalid longitude")
              for key in ("radar_support_share", "radar_coverage_share"):
                  if not 0 <= values[key] <= 1:
                      raise SystemExit(f"Row {index} has invalid {key}")

          areas = [float(row["area_ha"]) for row in rows]
          if any(left < right for left, right in zip(areas, areas[1:])):
              raise SystemExit("Pilot shortlist must be sorted by descending candidate area")

          print("Dashboard syntax and 20-row pilot snapshot checks passed.")
          PY
